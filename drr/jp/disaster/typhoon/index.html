<!DOCTYPE html>
<html lang="ko-kr">
<head>
    <title>방재허브_일본 - 태풍정보</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="/drr/jp/style.css">
    <link rel="stylesheet" href="/drr/jp/disaster/style.css">
    <link rel="stylesheet" href="/drr/jp/disaster/typhoon/style.css">
    <link href="/all.css" rel="stylesheet">
    <link href="/drr/style_menuBar.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.ico"/>
</head>
<body>
    <header id="mainHeader"></header>
    <div id="mainMenuBox"></div>
    <div id="drrMenuBox">
    </div>
    <div id="dropDownContainer"></div>
    <div id="tools">
    </div>
    <div class="content">
        <!-- <div id="announce">
        </div> -->
        <div class="contentTop">
            <h2>태풍정보</h2>
        </div>
        <div class="contentBox">
            <div class="left">
                <div id="map">
                    <h3 id="notyp">현재 태풍정보는 발표되어 있지 않습니다</h3>
                </div>
                <div class="map_bar_typ">
                    <div id="typ_all">
                        <a href="/drr/jp/disaster/typhoon/">현재 진행중인 모든 태풍 보기</a>
                    </div>
                    <p id="suiteiON">1시간 후 추정</p>
                </div>
            </div>
            <div class="right">
                <div id="clickit" class="right_box">
                    <!-- <h4>자세한 정보를 보려면 태풍명을 클릭해주세요</h4> -->
                    <h3>태풍목록</h3>
                    <div id="typ_list">
                    </div>
                </div>
                <div id="typ_info" class="right_box">
                    <h2 id="typ_name"></h2>
                    <p id="typ_reportTime"></p>
                    <div id="typ_prop">
                        <span id="now_size"></span>
                        <span id="now_strength"></span>
                    </div>
                    <p id="typ_outline"></p>
                    <div class="typ_now">
                        <span id="targetTime"></span>
                        <div>
                            <h4><span>중심기압</span> <span><span id="center_hPa" class="typ_now_value"></span><span> hPa</span></span></h4>
                        </div>
                        <div>
                            <h4><span>최대풍속</span> <span><span id="center_speed" class="typ_now_value"></span><span> m/s</span></span></h4>
                        </div>
                    </div>
                    <div class="now_spe">
                        <div class="now_spe_box">
                            <p>최대순간풍속</p>
                            <h4 id="center_instwind_speed"></h4>
                        </div>
                        <div class="now_spe_box">
                            <p>이동방향・속도</p>
                            <h4 id="center_movement"></h4>
                        </div>
                        <div class="now_spe_box">
                            <p>폭풍역</p>
                            <h4 id="storm_area"></h4>
                        </div>
                        <div class="now_spe_box">
                            <p>강풍역</p>
                            <h4 id="strong_area"></h4>
                        </div>
                        <div class="now_spe_box">
                            <p>중심위치</p>
                            <h4 id="center_coord"></h4>
                        </div>
                        <div class="now_spe_box">
                            <p>중심위치 정확도</p>
                            <h4 id="center_acc"></h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="contentBox left" id="bottom">
            <div id="forecastBox"></div>
        </div>
    </div>
</body>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="/drr/jp/disaster/typhoon/script.js"></script>
<script src="/src/mainHeaders.js"></script>
<script src="/src/tools.js"></script>
<script src="/drr/src/menubar.js"></script>
<!-- <script type="module" src="/src/announce.js"></script> -->
</html>
